/*
 * This file was generated by the Gradle 'init' task.
 */

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'application' // Add application plugin
}

apply plugin: 'com.google.protobuf'

// 使用更简洁的Protobuf配置方式
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.22.2'
    }
    
    // 仅保留基本配置
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

// 添加Protobuf依赖
configurations {
    proto
}

dependencies {
    // Existing dependencies
    api libs.org.json.json
    api libs.org.mongodb.mongodb.driver.sync
    api libs.redis.clients.jedis
    api libs.org.mindrot.jbcrypt
    api libs.com.sun.mail.javax.mail
    api libs.zxing.core
    api libs.zxing.javase
    
    // 添加SLF4J API和Logback实现
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    // 添加JUL到SLF4J的桥接
    implementation 'org.slf4j:jul-to-slf4j:1.7.36'

    // 替换Jetty WebSocket为Tyrus实现
    // 移除旧的Jetty WebSocket依赖
    // implementation 'org.eclipse.jetty.websocket:websocket-server:9.4.52.v20230823'
    // implementation 'org.eclipse.jetty.websocket:websocket-servlet:9.4.52.v20230823'
    // implementation 'org.eclipse.jetty:jetty-annotations:9.4.52.v20230823'
    // implementation 'org.eclipse.jetty.websocket:javax-websocket-server-impl:9.4.52.v20230823'
    
    // 添加Tyrus WebSocket实现
    implementation 'org.glassfish.tyrus:tyrus-server:2.1.3'
    implementation 'org.glassfish.tyrus:tyrus-container-grizzly-server:2.1.3'
    implementation 'org.glassfish.tyrus:tyrus-client:2.1.3'
    
    // 保留标准WebSocket API
    implementation 'javax.websocket:javax.websocket-api:1.1'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    // Explicitly use Jackson from jjwt-jackson for consistency
    runtimeOnly ('io.jsonwebtoken:jjwt-jackson:0.11.5') {
        // Exclude older/conflicting Jackson versions if necessary, but usually handled by Gradle
    }

    // JSR-250 Annotations (for @PostConstruct, @PreDestroy, etc.)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Jackson Databind (needed by jjwt-jackson and potentially other parts)
    // Ensure consistent versions
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.4'

    // Protobuf
    proto fileTree(dir: 'src/main/proto', include: '*.proto')
    implementation 'com.google.protobuf:protobuf-java:3.22.2'

    // Monitoring
    implementation 'io.micrometer:micrometer-core:1.10.5'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.10.5'
}

group = 'com.ZenTalk'
version = '1.5.1'
description = 'Java Realtime Communication Server'
java.sourceCompatibility = JavaVersion.VERSION_1_8

// Set default encoding for Java compilation
tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.withType(com.google.protobuf.gradle.GenerateProtoTask)
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

// 确保sourceSets正确包含生成的代码
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'build/generated/source/proto/main/java']
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    include 'com/ZenTalk/**'
}

shadowJar {
    manifest {
        attributes 'Main-Class': 'com.ZenTalk.server.Main'
    }
    archiveClassifier = ''
    mergeServiceFiles()
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
}

jar.dependsOn shadowJar
jar.enabled = false

// 如果是多模块的 Gradle 项目，则使用下面的配置，注意要 allprojects 下
allprojects {
  repositories {
    // // 当前项目生效，增加下面一项镜像源即可
    maven { url 'https://maven.aliyun.com/repository/public/' }
  }
}

// Configure the application plugin
application {
    // Define the main class for the application
    mainClass = 'com.ZenTalk.server.Main'
}
